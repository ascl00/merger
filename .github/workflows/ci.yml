name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ziglang/zig-action@master
        with:
          version: 0.16.0
      - name: Check formatting
        run: zig fmt --check
      - name: Build
        run: zig build
      - name: Run tests
        run: zig build test
